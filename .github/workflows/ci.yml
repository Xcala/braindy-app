# Checks every push and pull request: types (web, server, rules tests), web build, and the Firestore
# security rules against the emulator (demo project: no credentials, nothing deployed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w web
        env:
          VITE_RELEASE: ${{ github.sha }}
      - name: Firestore rules (emulator)
        run: npm run test:rules
