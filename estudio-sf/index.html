<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Estudio · Braindy SF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;700;900&family=Red+Hat+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estudio.css" />
</head>
<body>
  <main>
    <header>
      <h1>El Estudio</h1>
      <p>San Francisco · NicoMarca y sus 4 Brains</p>
    </header>
    <div class="sd-scroll">
      <div class="sd-scene">
        <div class="sd-cam">
          <img src="media/studio.jpg" alt="El estudio de Braindy en San Francisco" />
          <video muted loop playsinline aria-hidden="true"></video>
          <div class="sd-clock" aria-label="Hora en San Francisco y Bogotá">
            <b id="sf" style="left:68.4%;top:7%;width:6.4%;height:4.9%"></b>
            <b id="bog" style="left:76.9%;top:7%;width:6.4%;height:4.9%"></b>
          </div>
        </div>
        <div class="sd-bubbles"></div>
        <span class="sd-hint"></span>
        <video class="sd-closeup" muted loop playsinline preload="none" aria-hidden="true"></video>
        <aside class="sd-focus" aria-live="polite"></aside>
        <button type="button" class="sd-back"></button>
      </div>
    </div>
  </main>
  <script src="datos.js"></script>
  <script src="horario.js"></script>
  <script src="estudio.js"></script>
</body>
</html>
