    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Braindy" />

    <meta property="og:url" content="https://app.braindy.co/" />

    <script>
      // Appearance before the first paint (same rule as src/theme/useTheme.ts), so dark mode never flashes white.
      try { var p = localStorage.getItem('braindy.theme'); document.documentElement.dataset.theme = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
