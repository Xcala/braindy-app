<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Braindy</title>
    <meta name="theme-color" content="#F4F6FB" />
    <script>
      // Appearance before the first paint (same rule as src/theme/useTheme.ts), so dark mode never flashes white.
      try { var p = localStorage.getItem('braindy.theme'); document.documentElement.dataset.theme = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root" class="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
